name: release-build

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  build_mcrelay:
    name: Build Minecraft Relay Server (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - arch: amd64
            cc: gcc
            compiler_package: gcc
          - arch: arm64
            cc: aarch64-linux-gnu-gcc
            compiler_package: gcc-aarch64-linux-gnu
          - arch: armhf
            cc: arm-linux-gnueabihf-gcc
            compiler_package: gcc-arm-linux-gnueabihf
          - arch: ppc64el
            cc: powerpc64le-linux-gnu-gcc
            compiler_package: gcc-powerpc64le-linux-gnu
          - arch: riscv64
            cc: riscv64-linux-gnu-gcc
            compiler_package: gcc-riscv64-linux-gnu
          - arch: s390x
            cc: s390x-linux-gnu-gcc
            compiler_package: gcc-s390x-linux-gnu
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Install and update build dependencies
        env:
          COMPILER_PACKAGE: ${{ matrix.compiler_package }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          CODENAME=$(lsb_release -cs)
          APT_DIRECTORY=$(mktemp -d "$RUNNER_TEMP/mcrelay-apt.XXXXXX")
          mkdir "$APT_DIRECTORY/sources.list.d"
          printf '%s\n' \
            "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME} main restricted universe multiverse" \
            "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME}-updates main restricted universe multiverse" \
            "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME}-backports main restricted universe multiverse" \
            "deb [arch=amd64] http://security.ubuntu.com/ubuntu ${CODENAME}-security main restricted universe multiverse" \
            > "$APT_DIRECTORY/sources.list"
          if [ "$TARGET_ARCH" != amd64 ]; then
            sudo dpkg --add-architecture "$TARGET_ARCH"
            printf '%s\n' \
              "deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse" \
              "deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse" \
              "deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse" \
              "deb [arch=$TARGET_ARCH] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse" \
              >> "$APT_DIRECTORY/sources.list"
          fi
          sudo apt-get -o "Dir::Etc::sourcelist=$APT_DIRECTORY/sources.list" -o "Dir::Etc::sourceparts=$APT_DIRECTORY/sources.list.d" update
          sudo apt-get -o "Dir::Etc::sourcelist=$APT_DIRECTORY/sources.list" -o "Dir::Etc::sourceparts=$APT_DIRECTORY/sources.list.d" install -y \
            build-essential cmake "$COMPILER_PACKAGE" pandoc lintian gzip \
            "libcjson-dev:$TARGET_ARCH" "libsystemd-dev:$TARGET_ARCH"
      - name: Build deb
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_CC: ${{ matrix.cc }}
        run: sh packaging/deb/build-deb.sh --arch "$TARGET_ARCH" --cc "$TARGET_CC"
      - name: Lint debs
        run: |
          for deb in packaging/deb/out/*.deb; do
            echo "### $deb"
            case "$deb" in
              *_riscv64.deb)
                # Ubuntu 22.04's lintian 2.114 misclassifies riscv64 ELF as
                # foreign; fixed in lintian 2.129 and later.
                lintian --tag-display-limit 0 --suppress-tags binary-from-other-architecture "$deb"
                ;;
              *)
                lintian --tag-display-limit 0 "$deb"
                ;;
            esac
          done
      - name: Collect artifacts
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          # Reuse binaries compiled by build-deb.sh (build-deb-<arch>/mcrelay)
          mkdir -p build
          cp "build-deb-$TARGET_ARCH/mcrelay" "build/mcrelay-$TARGET_ARCH"
          cp packaging/deb/out/*.deb build/
      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mcrelay-${{ matrix.arch }}
          path: build/*
          if-no-files-found: error

  publish_release:
    name: Upload release artifacts
    needs: build_mcrelay
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: mcrelay-*
          path: build
          merge-multiple: true
      - name: Check artifact completeness
        run: |
          for arch in amd64 arm64 armhf ppc64el riscv64 s390x; do
            test -f "build/mcrelay-$arch"
            set -- build/mcrelay_*_"$arch".deb
            test "$#" -eq 1
            test -f "$1"
          done
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/* --repo "$GITHUB_REPOSITORY" --clobber
