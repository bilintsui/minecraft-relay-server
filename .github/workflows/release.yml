name: release-build

on:
  release:
    types:
      - published

jobs:
  build_mcrelay:
    name: Build Minecraft Relay Server
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Upgrade environment
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
      - name: Install toolchain
        run: |
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf gcc-powerpc64le-linux-gnu gcc-riscv64-linux-gnu gcc-s390x-linux-gnu pandoc lintian
          CODENAME=$(lsb_release -cs)
          sudo rm -f /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/*
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME} main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/main.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME}-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/main.list
          echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu ${CODENAME}-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/main.list
          echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu ${CODENAME}-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/main.list
          echo "deb [arch=arm64,armhf,ppc64el,riscv64,s390x] http://ports.ubuntu.com/ubuntu-ports ${CODENAME} main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/port.list
          echo "deb [arch=arm64,armhf,ppc64el,riscv64,s390x] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/port.list
          echo "deb [arch=arm64,armhf,ppc64el,riscv64,s390x] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-backports main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/port.list
          echo "deb [arch=arm64,armhf,ppc64el,riscv64,s390x] http://ports.ubuntu.com/ubuntu-ports ${CODENAME}-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/port.list
          sudo dpkg --add-architecture arm64
          sudo dpkg --add-architecture armhf
          sudo dpkg --add-architecture ppc64el
          sudo dpkg --add-architecture riscv64
          sudo dpkg --add-architecture s390x
          sudo apt-get update
          sudo apt-get install -y \
            libcjson-dev:amd64 libcjson-dev:arm64 libcjson-dev:armhf libcjson-dev:ppc64el libcjson-dev:riscv64 libcjson-dev:s390x \
            libsystemd-dev:amd64 libsystemd-dev:arm64 libsystemd-dev:armhf libsystemd-dev:ppc64el libsystemd-dev:riscv64 libsystemd-dev:s390x
      - name: Build deb amd64
        run: sh packaging/deb/build-deb.sh --arch amd64 --cc "$(which gcc)"
      - name: Build deb arm64
        run: sh packaging/deb/build-deb.sh --arch arm64 --cc "$(which aarch64-linux-gnu-gcc)"
      - name: Build deb armhf
        run: sh packaging/deb/build-deb.sh --arch armhf --cc "$(which arm-linux-gnueabihf-gcc)"
      - name: Build deb ppc64el
        run: sh packaging/deb/build-deb.sh --arch ppc64el --cc "$(which powerpc64le-linux-gnu-gcc)"
      - name: Build deb riscv64
        run: sh packaging/deb/build-deb.sh --arch riscv64 --cc "$(which riscv64-linux-gnu-gcc)"
      - name: Build deb s390x
        run: sh packaging/deb/build-deb.sh --arch s390x --cc "$(which s390x-linux-gnu-gcc)"
      - name: Lint debs
        run: |
          for deb in packaging/deb/out/*.deb; do
            echo "### $deb"
            case "$deb" in
              *_riscv64.deb)
                # Ubuntu 22.04's lintian 2.114 misclassifies riscv64 ELF as
                # foreign; fixed in lintian 2.129 and later.
                lintian --tag-display-limit 0 --suppress-tags binary-from-other-architecture "$deb"
                ;;
              *)
                lintian --tag-display-limit 0 "$deb"
                ;;
            esac
          done
      - name: Collect artifacts
        run: |
          # Reuse binaries compiled by build-deb.sh (build-deb-<arch>/mcrelay)
          mkdir -p build
          for arch in amd64 arm64 armhf ppc64el riscv64 s390x; do
            cp "build-deb-$arch/mcrelay" "build/mcrelay-$arch"
          done
          cp packaging/deb/out/*.deb build/
      - name: Upload artifacts
        uses: AButler/upload-release-assets@v4.0.0
        with:
          files: 'build/*'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
